<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <title>Construire une phrase - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .sentence-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
            padding-bottom: 24px;
        }

        /* Animated Mini-Theatre */
        .theatre-box {
            width: 94%;
            max-width: 560px;
            background: #FFFDF9;
            border: 4px solid #CBD5E1;
            border-radius: 26px;
            padding: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .theatre-svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
        }

        /* 3-Slot Grammar Sentence Track (Subject + Verb + Object) */
        .grammar-track {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 95%;
            max-width: 780px;
            background: #FFFFFF;
            border: 3px solid #E2E8F0;
            border-radius: 24px;
            padding: 12px 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .grammar-slot {
            min-width: 165px;
            min-height: 76px;
            padding: 8px 14px;
            border-radius: 18px;
            border: 3px dashed #CBD5E1;
            background: #F8FAFC;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.22s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .grammar-slot.active-slot {
            transform: scale(1.05);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.22);
        }
        .grammar-slot.slot-subject.active-slot { border-color: #2563EB; background: #EFF6FF; }
        .grammar-slot.slot-verb.active-slot    { border-color: #EA580C; background: #FFFBEB; }
        .grammar-slot.slot-object.active-slot  { border-color: #16A34A; background: #ECFDF5; }

        .grammar-slot.filled {
            border-style: solid;
            color: #FFFFFF;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }
        .grammar-slot.slot-subject.filled { background: #2563EB; border-color: #1D4ED8; }
        .grammar-slot.slot-verb.filled    { background: #EA580C; border-color: #C2410C; }
        .grammar-slot.slot-object.filled  { background: #16A34A; border-color: #15803D; }

        .slot-role-hint {
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #64748B;
        }
        .grammar-slot.filled .slot-role-hint {
            color: rgba(255, 255, 255, 0.9);
        }
        .slot-content {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3rem;
            font-weight: 800;
        }

        /* Selectable Word Block Cards */
        .word-blocks-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 780px;
            width: 95%;
            margin-top: 2px;
        }
        .grammar-card {
            min-width: 160px;
            padding: 14px 18px;
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.13s ease, opacity 0.25s ease, border-color 0.2s ease, background-color 0.2s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .grammar-card:active {
            transform: scale(0.94);
        }
        .grammar-card.role-subject { border-color: #60A5FA; }
        .grammar-card.role-verb    { border-color: #FB923C; }
        .grammar-card.role-object  { border-color: #4ADE80; }
        .grammar-card.soft-dim     { opacity: 0.36; transform: scale(0.94); }
        .grammar-card.winner       { border-color: #10B981; background: #ECFDF5; transform: scale(1.06); }

        .gc-icon {
            font-size: 2.8rem;
            line-height: 1.05;
        }
        .gc-label {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1E293B;
        }

        /* Responsive Visual Sizing */
        body[data-size="normal"] .theatre-box { max-width: 560px; }
        body[data-size="large"] .theatre-box { max-width: 680px; }
        body[data-size="xlarge"] .theatre-box { max-width: 820px; }

        body[data-size="normal"] .grammar-track { max-width: 780px; }
        body[data-size="large"] .grammar-track { max-width: 920px; }
        body[data-size="xlarge"] .grammar-track { max-width: 1080px; }

        body[data-size="normal"] .grammar-slot { min-width: 165px; min-height: 76px; }
        body[data-size="large"] .grammar-slot { min-width: 200px; min-height: 92px; }
        body[data-size="xlarge"] .grammar-slot { min-width: 240px; min-height: 108px; }

        body[data-size="normal"] .slot-content { font-size: 1.3rem; }
        body[data-size="large"] .slot-content { font-size: 1.6rem; }
        body[data-size="xlarge"] .slot-content { font-size: 1.95rem; }

        body[data-size="normal"] .grammar-card { min-width: 160px; padding: 14px 18px; }
        body[data-size="large"] .grammar-card { min-width: 200px; padding: 18px 22px; }
        body[data-size="xlarge"] .grammar-card { min-width: 245px; padding: 22px 28px; }

        body[data-size="normal"] .gc-icon { font-size: 2.8rem; }
        body[data-size="large"] .gc-icon { font-size: 3.6rem; }
        body[data-size="xlarge"] .gc-icon { font-size: 4.4rem; }

        body[data-size="normal"] .gc-label { font-size: 1.25rem; }
        body[data-size="large"] .gc-label { font-size: 1.55rem; }
        body[data-size="xlarge"] .gc-label { font-size: 1.85rem; }

        @media (max-width: 560px) {
            .grammar-slot { min-width: 112px; min-height: 64px; padding: 6px 10px; }
            .slot-content { font-size: 1.05rem; }
            .grammar-card { min-width: 132px; padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">💬 Construire une phrase</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="sentence-stage">
        <!-- 3 Progressive Sentence Modes -->
        <nav class="routine-pills" aria-label="Select sentence mode">
            <button class="routine-pill active" id="mode-finish-btn">🧩 Finir la phrase (3e bloc)</button>
            <button class="routine-pill" id="mode-build-btn">🏗️ Construire (3 blocs)</button>
            <button class="routine-pill" id="mode-free-btn">🎨 Créer librement</button>
        </nav>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); margin: 0;">Complète la phrase !</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Animated Action Stage -->
        <div class="theatre-box">
            <svg class="theatre-svg" id="sentence-svg" viewBox="0 0 540 240" aria-label="Sentence action animation"></svg>
        </div>

        <!-- 3 Grammar Slots: Subject + Verb + Object -->
        <section class="grammar-track" id="grammar-track" aria-label="Sentence blocks"></section>

        <!-- Selectable Word Cards -->
        <section class="word-blocks-row" id="word-choices" aria-label="Word choices"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/sentences-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
