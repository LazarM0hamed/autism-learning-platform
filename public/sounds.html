<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Les Sons - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .sound-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 18px;
        }

        /* Big Tactile Sound Replay Button */
        .play-sound-hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #4D96FF;
            color: #FFFFFF;
            border: none;
            border-radius: 28px;
            padding: 18px 36px;
            font-size: 1.45rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 0 #2B6CB0, 0 12px 20px rgba(77, 150, 255, 0.25);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.2s;
            user-select: none;
        }
        .play-sound-hero:hover {
            filter: brightness(1.05);
        }
        .play-sound-hero:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #2B6CB0;
        }
        .play-sound-hero.playing {
            background: #38B2AC;
            box-shadow: 0 8px 0 #285E61;
            animation: pulseWave 0.7s infinite alternate;
        }
        @keyframes pulseWave {
            from { transform: scale(1); }
            to   { transform: scale(1.05); }
        }

        /* Choice Cards */
        .sound-choices-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 22px;
            max-width: var(--options-grid-max-w, 880px);
            width: 100%;
            margin-top: 8px;
        }
        .sound-card {
            width: var(--card-width, clamp(160px, 24vw, 210px));
            min-height: var(--card-height, clamp(180px, 28vw, 240px));
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 24px;
            padding: var(--card-padding, 16px 12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
            transition: transform 0.15s ease, border-color 0.2s ease, background-color 0.2s ease, width 0.2s ease, min-height 0.2s ease;
            user-select: none;
        }
        .sound-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
        }
        .sound-card:active {
            transform: scale(0.95);
        }
        .sound-card.correct {
            border-color: #34D399;
            background-color: #ECFDF5;
            animation: gentle-pop 0.35s ease forwards;
        }
        .sound-card-visual {
            width: var(--img-size, 100px);
            height: var(--img-size, 100px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--img-size, 100px) * 0.72);
            margin-bottom: 10px;
        }
        .sound-card-visual img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 14px;
        }
        .sound-card-label {
            font-size: var(--card-font-size, 1.25rem);
            font-weight: 800;
            color: #1E293B;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">🔊 Reconnaître les sons</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="sound-stage">
        <!-- Category Switcher Pills -->
        <nav class="routine-pills" id="sound-category-pills" aria-label="Select sound category"></nav>

        <div class="prompt-container" style="margin: 4px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.45rem, 3.6vw, 2.1rem);">Écoute bien : qui fait ce bruit ?</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Big Replay Sound Effect Button -->
        <button class="play-sound-hero" id="replay-fx-btn">
            <span style="font-size: 2rem;">🔉</span>
            <span id="replay-fx-text">Écouter le son</span>
        </button>

        <!-- Visual Choices -->
        <section class="sound-choices-grid" id="options-container" aria-label="Sound choices"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/sounds-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
