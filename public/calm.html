<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F0F4F8">
    <title>Coin Calme & Sensoriel - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.calm-theme {
            background-color: #F0F4F8;
            transition: background-color 0.8s ease;
        }
        .calm-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            padding-bottom: 24px;
        }

        /* Breathing Circle Stage */
        .breathing-card {
            width: 94%;
            max-width: 500px;
            background: #FFFFFF;
            border: 4px solid #BAE6FD;
            border-radius: 30px;
            padding: 22px;
            box-shadow: 0 10px 28px rgba(56, 189, 248, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .breath-visual-box {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .breath-halo {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.4) 0%, rgba(167, 243, 208, 0.18) 70%, transparent 100%);
            transform: scale(0.55);
            transition: transform 0.1s linear;
        }
        .breath-core {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: linear-gradient(135deg, #93C5FD 0%, #A7F3D0 100%);
            box-shadow: 0 8px 24px rgba(147, 197, 253, 0.45), inset 0 4px 12px rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            transform: scale(0.58);
            user-select: none;
            transition: transform 0.1s linear;
        }
        .breath-cue-text {
            font-size: 1.55rem;
            font-weight: 800;
            color: #1D4ED8;
            text-align: center;
            min-height: 38px;
        }
        .calm-action-btn {
            background: #3B82F6;
            color: #FFFFFF;
            border: none;
            border-radius: 20px;
            padding: 12px 28px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #1D4ED8;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            user-select: none;
        }
        .calm-action-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* Pastel Sensory Pop-It Board */
        .popit-board {
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-sizing: border-box;
        }
        .popit-grid {
            display: grid;
            grid-template-columns: repeat(5, 64px);
            gap: 12px;
        }
        .pop-bubble {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.14), inset 0 4px 8px rgba(255, 255, 255, 0.65);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
            user-select: none;
        }
        .pop-bubble.popped {
            transform: translateY(4px) scale(0.92);
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.22);
            filter: brightness(0.92);
        }

        /* Ambient Nature Soundscapes */
        .soundscape-card {
            width: 94%;
            max-width: 520px;
            background: #FFFFFF;
            border: 4px solid #CBD5E1;
            border-radius: 28px;
            padding: 18px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-sizing: border-box;
        }
        .ambient-buttons-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ambient-btn {
            padding: 14px 22px;
            border-radius: 20px;
            border: 3px solid #E2E8F0;
            background: #F8FAFC;
            font-size: 1.15rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .ambient-btn.active {
            background: #EFF6FF;
            border-color: #3B82F6;
            color: #1D4ED8;
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.2);
        }

        /* Responsive Visual Sizing */
        body[data-size="normal"] .breathing-card { max-width: 500px; }
        body[data-size="large"] .breathing-card { max-width: 640px; }
        body[data-size="xlarge"] .breathing-card { max-width: 780px; }

        body[data-size="normal"] .popit-grid { grid-template-columns: repeat(5, 64px); gap: 12px; }
        body[data-size="large"] .popit-grid { grid-template-columns: repeat(5, 78px); gap: 14px; }
        body[data-size="xlarge"] .popit-grid { grid-template-columns: repeat(5, 94px); gap: 16px; }

        body[data-size="normal"] .pop-bubble { width: 64px; height: 64px; }
        body[data-size="large"] .pop-bubble { width: 78px; height: 78px; }
        body[data-size="xlarge"] .pop-bubble { width: 94px; height: 94px; }

        @media (max-width: 480px) {
            .popit-grid { grid-template-columns: repeat(5, 52px); gap: 9px; }
            .pop-bubble { width: 52px; height: 52px; }
        }
    </style>
</head>
<body class="calm-theme">
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">🌿 Coin Calme</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="calm-stage">
        <!-- 3 Sensory Regulation Tools -->
        <nav class="routine-pills" aria-label="Select calm tool">
            <button class="routine-pill active" id="tool-breath-btn">🫧 Bulle de Respiration</button>
            <button class="routine-pill" id="tool-popit-btn">🔘 Pop-It Sensoriel</button>
            <button class="routine-pill" id="tool-sounds-btn">🌧️ Sons Apaisants</button>
        </nav>

        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.2rem, 3.2vw, 1.8rem); margin: 0;">Prends un moment calme pour toi</h1>
        </div>

        <!-- Dynamic Sensory Tool Container -->
        <section id="calm-workspace" style="width: 100%; display: flex; justify-content: center;"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/calm-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
