<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <title>Syllabes Musicales - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .syllable-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
            padding-bottom: 24px;
        }

        /* Consonant Selector Strip */
        .consonant-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 760px;
            width: 95%;
        }
        .cons-btn {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            border: 3px solid #CBD5E1;
            background: #FFFFFF;
            font-size: 1.45rem;
            font-weight: 800;
            color: #1E293B;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            transition: transform 0.12s ease, border-color 0.2s ease, background-color 0.2s ease;
            user-select: none;
        }
        .cons-btn:active {
            transform: scale(0.94);
        }
        .cons-btn.active {
            background: #2563EB;
            border-color: #1D4ED8;
            color: #FFFFFF;
            transform: scale(1.08);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        /* Animated Magnetic Fusion Machine Frame */
        .fusion-frame {
            width: 94%;
            max-width: 560px;
            background: #FFFDF9;
            border: 4px solid #CBD5E1;
            border-radius: 26px;
            padding: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .fusion-svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            user-select: none;
        }

        /* Musical Vowel Keys (Explorer Mode) */
        .vowel-keys-tray {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            background: #F3E5D8;
            border: 3px solid #DDB892;
            border-radius: 24px;
            padding: 12px 18px;
            box-shadow: 0 8px 18px rgba(127, 85, 57, 0.12);
            max-width: 760px;
            width: 94%;
            box-sizing: border-box;
        }
        .vowel-key-btn {
            width: 106px;
            height: 96px;
            border: none;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: #FFFFFF;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.22), inset 0 3px 6px rgba(255, 255, 255, 0.35);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            user-select: none;
        }
        .vowel-key-btn.dark-text {
            color: #1E293B;
        }
        .vowel-key-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.22);
        }
        .vk-letter {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.05;
        }
        .vk-note-tag {
            font-size: 0.88rem;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.3);
            padding: 2px 8px;
            border-radius: 8px;
        }

        /* Challenge Choice Cards */
        .syllable-choices-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 760px;
            width: 94%;
            margin-top: 4px;
        }
        .syl-choice-card {
            min-width: 155px;
            padding: 16px 22px;
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.13s ease, opacity 0.25s ease, border-color 0.2s ease, background-color 0.2s ease;
            user-select: none;
        }
        .syl-choice-card:active {
            transform: scale(0.94);
        }
        .syl-choice-card.soft-dim {
            opacity: 0.38;
            transform: scale(0.94);
        }
        .syl-choice-card.winner {
            border-color: #10B981 !important;
            background: #ECFDF5 !important;
            transform: scale(1.06);
            box-shadow: 0 8px 22px rgba(16, 185, 129, 0.22);
        }
        .syl-big-text {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.1;
        }
        .syl-note-sub {
            font-size: 0.95rem;
            font-weight: 800;
            color: #64748B;
        }

        /* Musical Bridge Comparison Button */
        .compare-note-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #EFF6FF;
            border: 2px solid #BFDBFE;
            border-radius: 16px;
            padding: 8px 20px;
            font-size: 0.98rem;
            font-weight: 800;
            color: #1D4ED8;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1);
            transition: transform 0.1s ease, background 0.15s ease;
            user-select: none;
        }
        .compare-note-btn:hover {
            background: #DBEAFE;
        }
        .compare-note-btn:active {
            transform: scale(0.96);
        }

        /* Responsive Visual Sizing */
        body[data-size="normal"] .fusion-frame { max-width: 560px; }
        body[data-size="large"] .fusion-frame { max-width: 720px; }
        body[data-size="xlarge"] .fusion-frame { max-width: 880px; }

        body[data-size="normal"] .vowel-key-btn { width: 106px; height: 96px; }
        body[data-size="large"] .vowel-key-btn { width: 132px; height: 118px; }
        body[data-size="xlarge"] .vowel-key-btn { width: 160px; height: 142px; }

        body[data-size="normal"] .vk-letter { font-size: 2.1rem; }
        body[data-size="large"] .vk-letter { font-size: 2.8rem; }
        body[data-size="xlarge"] .vk-letter { font-size: 3.5rem; }

        body[data-size="normal"] .cons-btn { width: 52px; height: 52px; font-size: 1.45rem; }
        body[data-size="large"] .cons-btn { width: 66px; height: 66px; font-size: 1.85rem; }
        body[data-size="xlarge"] .cons-btn { width: 80px; height: 80px; font-size: 2.25rem; }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">🎶 Syllabes & Voyelles</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="syllable-stage">
        <!-- 3 Progressive Learning Modes -->
        <nav class="routine-pills" aria-label="Select syllable mode">
            <button class="routine-pill active" id="mode-explore-btn">🎹 Explorer (Fusion)</button>
            <button class="routine-pill" id="mode-vowels-btn">🎯 Défi : Voyelles</button>
            <button class="routine-pill" id="mode-music-btn">🎶 Défi : Comme la note</button>
        </nav>

        <!-- Consonant Selector Bar -->
        <div class="consonant-bar" id="consonant-bar" aria-label="Select consonant"></div>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); margin: 0;">Choisis une voyelle musicale !</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Musical Bridge Comparison Button -->
        <button class="compare-note-btn" id="compare-note-btn">🎵 Écouter le lien musical (DO ➡️ BO)</button>

        <!-- Animated Magnetic Block Fusion Stage -->
        <div class="fusion-frame">
            <svg class="fusion-svg" id="fusion-svg" viewBox="0 0 540 245" aria-label="Syllable fusion machine"></svg>
        </div>

        <!-- Interactive Vowel Keys or Challenge Choices -->
        <section id="controls-area" style="width: 100%; display: flex; justify-content: center;"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/syllables-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
