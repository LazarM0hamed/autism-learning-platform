<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <title>Assembler des Mots - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .wb-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
            padding-bottom: 24px;
        }

        /* Animated Magnetic Word Assembly Theatre */
        .wb-frame {
            width: 94%;
            max-width: 560px;
            background: #FFFDF9;
            border: 4px solid #CBD5E1;
            border-radius: 26px;
            padding: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .wb-svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            user-select: none;
        }

        /* Hear Syllable-by-Syllable Helper Button */
        .syllable-break-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #EFF6FF;
            border: 2px solid #BFDBFE;
            border-radius: 16px;
            padding: 8px 18px;
            font-size: 0.98rem;
            font-weight: 800;
            color: #1D4ED8;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1);
            transition: transform 0.1s ease, background 0.15s ease;
            user-select: none;
        }
        .syllable-break-btn:hover {
            background: #DBEAFE;
        }
        .syllable-break-btn:active {
            transform: scale(0.96);
        }

        /* Selectable Syllable Block Cards */
        .wb-choices-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 760px;
            width: 94%;
            margin-top: 4px;
        }
        .wb-syl-card {
            min-width: 150px;
            padding: 16px 22px;
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.13s ease, opacity 0.25s ease, border-color 0.2s ease, background-color 0.2s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .wb-syl-card:active {
            transform: scale(0.94);
        }
        .wb-syl-card.soft-dim {
            opacity: 0.36;
            transform: scale(0.94);
        }
        .wb-syl-card.winner {
            border-color: #10B981 !important;
            background: #ECFDF5 !important;
            transform: scale(1.06);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
        }
        .wb-syl-text {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.1;
        }
        .wb-syl-note {
            font-size: 0.88rem;
            font-weight: 800;
            color: #64748B;
        }

        /* Responsive Visual Sizing */
        body[data-size="normal"] .wb-frame { max-width: 560px; }
        body[data-size="large"] .wb-frame { max-width: 720px; }
        body[data-size="xlarge"] .wb-frame { max-width: 880px; }

        body[data-size="normal"] .wb-syl-card { min-width: 150px; padding: 16px 22px; }
        body[data-size="large"] .wb-syl-card { min-width: 190px; padding: 20px 28px; }
        body[data-size="xlarge"] .wb-syl-card { min-width: 235px; padding: 24px 34px; }

        body[data-size="normal"] .wb-syl-text { font-size: 2.5rem; }
        body[data-size="large"] .wb-syl-text { font-size: 3.2rem; }
        body[data-size="xlarge"] .wb-syl-text { font-size: 4rem; }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">🧩 Assembler des Mots</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="wb-stage">
        <!-- 3 Progressive Word-Building Modes -->
        <nav class="routine-pills" aria-label="Select word builder mode">
            <button class="routine-pill active" id="mode-complete-btn">🧩 Finir le mot (2e syllabe)</button>
            <button class="routine-pill" id="mode-build-btn">🏗️ Construire (2 syllabes)</button>
            <button class="routine-pill" id="mode-listen-btn">👂 Sans indice</button>
        </nav>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); margin: 0;">Complète le mot : MOTO</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Syllable Breakdown Audio Button -->
        <button class="syllable-break-btn" id="break-word-btn">🎵 Écouter les 2 syllabes (MO - TO)</button>

        <!-- Animated Magnetic Word Assembly Stage -->
        <div class="wb-frame">
            <svg class="wb-svg" id="wb-svg" viewBox="0 0 540 270" aria-label="Word assembly stage"></svg>
        </div>

        <!-- Syllable Choice Cards -->
        <section class="wb-choices-row" id="wb-choices" aria-label="Syllable choices"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/word-builder-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
