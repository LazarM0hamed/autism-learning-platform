<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <title>Émotions & Situations - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .emotions-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
            padding-bottom: 24px;
        }

        /* Story Theatre Frame */
        .story-scene-frame {
            width: 94%;
            max-width: 540px;
            background: #FFFDF9;
            border: 4px solid #CBD5E1;
            border-radius: 26px;
            padding: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .story-scene-svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            user-select: none;
        }

        /* Choice Cards Grid */
        .emotion-choices-grid {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 780px;
            width: 95%;
            margin-top: 4px;
        }
        .emotion-card {
            width: 175px;
            padding: 14px 12px;
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease, opacity 0.25s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .emotion-card:active {
            transform: scale(0.94);
        }
        .emotion-card.soft-dim {
            opacity: 0.38;
            transform: scale(0.94);
        }
        .emotion-card.winner {
            border-color: #10B981 !important;
            background: #ECFDF5 !important;
            transform: scale(1.06);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
        }
        .emotion-label {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1E293B;
            text-align: center;
        }
        .action-icon-big {
            font-size: 3.4rem;
            line-height: 1.1;
        }

        /* Responsive Visual Sizing */
        body[data-size="normal"] .story-scene-frame { max-width: 540px; }
        body[data-size="large"] .story-scene-frame { max-width: 700px; }
        body[data-size="xlarge"] .story-scene-frame { max-width: 860px; }

        body[data-size="normal"] .emotion-card { width: 175px; padding: 14px 12px; }
        body[data-size="large"] .emotion-card { width: 220px; padding: 18px 16px; }
        body[data-size="xlarge"] .emotion-card { width: 270px; padding: 24px 20px; }

        body[data-size="normal"] .emotion-label { font-size: 1.2rem; }
        body[data-size="large"] .emotion-label { font-size: 1.45rem; }
        body[data-size="xlarge"] .emotion-label { font-size: 1.75rem; }

        body[data-size="normal"] .action-icon-big { font-size: 3.4rem; }
        body[data-size="large"] .action-icon-big { font-size: 4.4rem; }
        body[data-size="xlarge"] .action-icon-big { font-size: 5.4rem; }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">😊 Émotions & Situations</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="emotions-stage">
        <!-- 3 Progressive Learning Modes -->
        <nav class="routine-pills" aria-label="Select emotion mode">
            <button class="routine-pill active" id="mode-faces-btn">😊 Les Visages</button>
            <button class="routine-pill" id="mode-situations-btn">🎬 Situations</button>
            <button class="routine-pill" id="mode-help-btn">💛 Aider & Calmer</button>
        </nav>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); margin: 0;">Comment se sent-il ?</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Visual Situation / Character Stage -->
        <div class="story-scene-frame" id="story-frame">
            <svg class="story-scene-svg" id="emotion-svg" viewBox="0 0 520 265" aria-label="Emotion story scene"></svg>
        </div>

        <!-- Emotion or Comforting Action Choices -->
        <section class="emotion-choices-grid" id="choices-grid" aria-label="Emotion choices"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/emotions-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
