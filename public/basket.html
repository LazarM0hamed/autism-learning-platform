<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Basket des Formes - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .basket-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 10px;
        }
        .score-pill {
            background: #FFFBEB;
            border: 2px solid #F6E05E;
            color: #975A16;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 6px 18px;
            border-radius: 16px;
        }
        .court-frame {
            width: 94%;
            max-width: 500px;
            background: #FFFDF9;
            border: 4px solid #E6CCB2;
            border-radius: 26px;
            padding: 8px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
        }
        .court-svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
        }
        .ball-launch-btn {
            cursor: pointer;
            user-select: none;
            transition: filter 0.15s ease;
            transform: none !important;
            outline: none !important;
        }
        .ball-launch-btn:hover {
            filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.85)) drop-shadow(0 0 18px rgba(37, 99, 235, 0.5)) brightness(1.08);
            transform: none !important;
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">🏀 Basket des Formes</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="basket-stage">
        <!-- Difficulty Switcher -->
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center;">
            <nav class="routine-pills" style="margin: 0;">
                <button class="routine-pill active" id="mode-4shapes-btn">🔷 4 Formes</button>
                <button class="routine-pill" id="mode-6shapes-btn">⭐ 6 Formes</button>
            </nav>
            <span class="score-pill" id="score-pill">⭐ Paniers : 0</span>
        </div>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.35rem, 3.4vw, 1.95rem); margin: 0;">Lance le ballon...</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat audio prompt" aria-label="Repeat audio prompt">🗣️</button>
        </div>

        <!-- Interactive Basketball Court SVG -->
        <div class="court-frame">
            <svg class="court-svg" id="basket-svg" viewBox="0 0 460 390" aria-label="Shape basketball court"></svg>
        </div>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/basket-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
