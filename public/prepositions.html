<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <title>Positions dans l'espace - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .prep-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
            padding-bottom: 24px;
        }

        /* Character Switcher Bar */
        .char-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .char-btn {
            background: #FFFFFF;
            border: 3px solid #E2E8F0;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 1.05rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.2s ease, background-color 0.2s ease;
            user-select: none;
        }
        .char-btn:active {
            transform: scale(0.95);
        }
        .char-btn.active {
            background: #EFF6FF;
            border-color: #3B82F6;
            color: #1D4ED8;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        /* Interactive Scene Frame */
        .scene-board-frame {
            width: 94%;
            max-width: 540px;
            background: #FFFDF9;
            border: 4px solid #CBD5E1;
            border-radius: 26px;
            padding: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .prep-svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            user-select: none;
        }
        .hotspot-zone {
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .hotspot-zone:hover circle,
        .hotspot-zone:hover rect {
            stroke-width: 4;
            fill: rgba(59, 130, 246, 0.28);
        }

        /* Preposition Choice Cards */
        .prep-choices-grid {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 780px;
            width: 95%;
            margin-top: 4px;
        }
        .prep-card {
            width: 175px;
            padding: 12px 10px;
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease, opacity 0.25s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .prep-card:active {
            transform: scale(0.94);
        }
        .prep-card.soft-dim {
            opacity: 0.36;
            transform: scale(0.94);
        }
        .prep-card.winner {
            border-color: #10B981 !important;
            background: #ECFDF5 !important;
            transform: scale(1.06);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
        }
        .prep-label {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1E293B;
            text-align: center;
        }

        /* Responsive Visual Sizing */
        body[data-size="normal"] .scene-board-frame { max-width: 540px; }
        body[data-size="large"] .scene-board-frame { max-width: 700px; }
        body[data-size="xlarge"] .scene-board-frame { max-width: 860px; }

        body[data-size="normal"] .prep-card { width: 175px; padding: 12px 10px; }
        body[data-size="large"] .prep-card { width: 220px; padding: 16px 14px; }
        body[data-size="xlarge"] .prep-card { width: 270px; padding: 20px 18px; }

        body[data-size="normal"] .prep-label { font-size: 1.25rem; }
        body[data-size="large"] .prep-label { font-size: 1.55rem; }
        body[data-size="xlarge"] .prep-label { font-size: 1.85rem; }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">📦 Sur, Sous, Dans...</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="prep-stage">
        <!-- 3 Progressive Learning Modes -->
        <nav class="routine-pills" aria-label="Select preposition mode">
            <button class="routine-pill active" id="mode-place-btn">🎮 Placer l'objet</button>
            <button class="routine-pill" id="mode-find-btn">👀 Où est-il ?</button>
            <button class="routine-pill" id="mode-all-btn">🌟 Les 6 positions</button>
        </nav>

        <!-- Selectable Character -->
        <div class="char-bar" id="char-bar" aria-label="Choose character"></div>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); margin: 0;">Mets le chat SUR la table !</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Interactive SVG Scene -->
        <div class="scene-board-frame">
            <svg class="prep-svg" id="prep-svg" viewBox="0 0 520 300" aria-label="Spatial prepositions scene"></svg>
        </div>

        <!-- Visual Preposition Cards -->
        <section class="prep-choices-grid" id="choices-grid" aria-label="Preposition choices"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/prepositions-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
