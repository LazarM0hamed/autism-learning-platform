<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Activity - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Home</a>
        </div>
        <h2 id="category-title" class="category-badge">Loading...</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>
    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <!-- Category Filter Pills -->
        <nav class="routine-pills" id="category-filter-pills" aria-label="Category Filters" style="margin-bottom: 12px;"></nav>

        <div class="prompt-container">
            <h1 class="prompt-text" id="prompt-label">Find the...</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat audio prompt" aria-label="Repeat audio prompt">🗣️</button>
        </div>

        <section class="options-grid" id="options-container" aria-label="Choice options"></section>
    </main>

    <footer class="settings-bar">
        <span class="settings-label" id="choices-label">Choices:</span>
        <button class="difficulty-pill" data-count="2" title="2 choices (ABA/Discrete Trial)">2</button>
        <button class="difficulty-pill" data-count="3" title="3 choices">3</button>
        <button class="difficulty-pill" data-count="4" title="4 choices">4</button>
    </footer>

    <script src="js/tracker.js"></script>
    <script src="js/game-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
