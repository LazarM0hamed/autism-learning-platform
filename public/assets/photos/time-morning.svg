<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <!-- Background: Cozy Bedroom Wall -->
  <rect width="160" height="120" rx="20" fill="#FEF3C7"/>

  <!-- Bedroom Window showing Sunrise -->
  <rect x="18" y="14" width="56" height="52" rx="6" fill="#FDE68A" stroke="#F59E0B" stroke-width="2.5"/>
  <rect x="22" y="18" width="48" height="44" rx="4" fill="#FEF08A"/>
  <!-- Window Cross Pane -->
  <line x1="46" y1="18" x2="46" y2="62" stroke="#F59E0B" stroke-width="2"/>
  <line x1="22" y1="40" x2="70" y2="40" stroke="#F59E0B" stroke-width="2"/>
  <!-- Rising Golden Sun -->
  <circle cx="46" cy="46" r="14" fill="#F59E0B"/>
  <circle cx="46" cy="46" r="10" fill="#FDE047"/>
  <!-- Sun Rays -->
  <line x1="46" y1="24" x2="46" y2="28" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="34" x2="34" y2="37" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="34" x2="58" y2="37" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Alarm Clock on Side Table -->
  <rect x="12" y="74" width="22" height="24" rx="4" fill="#D97706"/>
  <circle cx="23" cy="84" r="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <line x1="23" y1="84" x2="23" y2="81" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="84" x2="26" y2="84" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bed Structure -->
  <rect x="68" y="66" width="82" height="40" rx="8" fill="#92400E"/>
  <rect x="64" y="52" width="10" height="54" rx="4" fill="#78350F"/>
  <rect x="144" y="68" width="8" height="38" rx="4" fill="#78350F"/>
  <!-- Pillow -->
  <rect x="74" y="58" width="28" height="16" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Blue Duvet Blanket -->
  <rect x="72" y="74" width="74" height="28" rx="6" fill="#60A5FA"/>
  <path d="M72 74 Q108 78 146 74" stroke="#2563EB" stroke-width="2" fill="none"/>

  <!-- Young Boy Waking Up & Stretching Arms -->
  <!-- T-shirt / Pajamas -->
  <rect x="88" y="52" width="24" height="24" rx="5" fill="#F97316"/>
  <!-- Head -->
  <circle cx="100" cy="38" r="11" fill="#FDBA74"/>
  <!-- Hair -->
  <path d="M89 36 C89 26 111 26 111 36 C111 30 100 28 89 36 Z" fill="#78350F"/>
  <!-- Happy Waking Face -->
  <circle cx="96" cy="38" r="1.5" fill="#1E293B"/>
  <circle cx="104" cy="38" r="1.5" fill="#1E293B"/>
  <path d="M97 42 Q100 45 103 42" stroke="#78350F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Stretching Arms Up High -->
  <path d="M88 56 Q80 44 80 34" stroke="#FDBA74" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M112 56 Q120 44 120 34" stroke="#FDBA74" stroke-width="4.5" stroke-linecap="round" fill="none"/>
</svg>
