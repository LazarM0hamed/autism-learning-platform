<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Background -->
  <rect width="120" height="120" rx="22" fill="#F0FDF4"/>

  <!-- Bathroom Sink -->
  <rect x="28" y="60" width="64" height="28" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5"/>
  <rect x="48" y="88" width="24" height="22" rx="4" fill="#E2E8F0"/>
  
  <!-- Chrome Faucet -->
  <path d="M60 40 L60 48 Q60 52 52 52" stroke="#94A3B8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <rect x="56" y="36" width="8" height="6" rx="2" fill="#64748B"/>
  
  <!-- Clean Running Water Stream -->
  <line x1="52" y1="53" x2="52" y2="68" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Hands under water with bubbles -->
  <ellipse cx="46" cy="68" rx="8" ry="5" fill="#FDBA74"/>
  <ellipse cx="58" cy="68" rx="8" ry="5" fill="#FDBA74"/>
  
  <!-- Soap Bubbles -->
  <circle cx="44" cy="62" r="4" fill="#BAE6FD" opacity="0.9" stroke="#38BDF8" stroke-width="1"/>
  <circle cx="56" cy="61" r="5" fill="#BAE6FD" opacity="0.9" stroke="#38BDF8" stroke-width="1"/>
  <circle cx="50" cy="58" r="3.5" fill="#BAE6FD" opacity="0.9" stroke="#38BDF8" stroke-width="1"/>
  <circle cx="64" cy="65" r="3" fill="#BAE6FD" opacity="0.9" stroke="#38BDF8" stroke-width="1"/>

  <!-- Boy's smiling face -->
  <circle cx="60" cy="22" r="11" fill="#FDBA74"/>
  <path d="M49 20 C49 11 71 11 71 20 C71 15 60 13 49 20 Z" fill="#78350F"/>
  <circle cx="56" cy="22" r="1.5" fill="#1E293B"/>
  <circle cx="64" cy="22" r="1.5" fill="#1E293B"/>
  <path d="M57 26 Q60 29 63 26" stroke="#78350F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
