<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <!-- Sky: Bright Afternoon Blue -->
  <rect width="160" height="120" rx="20" fill="#E0F2FE"/>

  <!-- Midday Sun in Sky -->
  <circle cx="132" cy="28" r="16" fill="#FDE047"/>
  <circle cx="132" cy="28" r="12" fill="#F59E0B"/>
  <line x1="132" y1="6" x2="132" y2="10" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="132" y1="46" x2="132" y2="50" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="28" x2="114" y2="28" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="150" y1="28" x2="154" y2="28" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- White Fluffy Cloud -->
  <path d="M18 36 Q24 26 34 28 Q44 24 52 30 Q60 30 62 38 Q64 46 54 46 L24 46 Q16 46 18 36 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Park Tree -->
  <rect x="22" y="58" width="10" height="38" rx="3" fill="#92400E"/>
  <circle cx="27" cy="46" r="22" fill="#22C55E"/>
  <circle cx="36" cy="40" r="16" fill="#16A34A"/>
  <circle cx="18" cy="44" r="14" fill="#15803D"/>

  <!-- Green Grass Lawn -->
  <rect x="0" y="82" width="160" height="38" rx="0" fill="#4ADE80"/>
  <path d="M0 82 Q40 76 80 82 Q120 88 160 82 L160 120 L0 120 Z" fill="#22C55E"/>

  <!-- Young Boy Kicking Soccer Ball in Park -->
  <!-- Legs / Blue Shorts -->
  <rect x="82" y="66" width="22" height="12" rx="4" fill="#2563EB"/>
  <!-- Left Leg standing -->
  <rect x="84" y="78" width="6" height="22" rx="3" fill="#FDBA74"/>
  <ellipse cx="87" cy="100" rx="6" ry="3.5" fill="#1E293B"/>
  <!-- Right Leg kicking forward -->
  <path d="M98 76 L112 84" stroke="#FDBA74" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <ellipse cx="114" cy="86" rx="5" ry="3.5" fill="#1E293B"/>

  <!-- T-shirt / Orange -->
  <rect x="80" y="46" width="26" height="22" rx="6" fill="#F97316"/>
  <!-- Arms running/balancing -->
  <path d="M80 50 Q72 58 68 54" stroke="#FDBA74" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M106 50 Q114 56 120 52" stroke="#FDBA74" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <circle cx="93" cy="34" r="11" fill="#FDBA74"/>
  <!-- Hair -->
  <path d="M82 32 C82 22 104 22 104 32 C104 26 93 24 82 32 Z" fill="#78350F"/>
  <!-- Cheerful Face -->
  <circle cx="89" cy="34" r="1.5" fill="#1E293B"/>
  <circle cx="97" cy="34" r="1.5" fill="#1E293B"/>
  <path d="M90 38 Q93 41 96 38" stroke="#78350F" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Soccer Ball -->
  <circle cx="128" cy="88" r="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <polygon points="128,83 132,86 130,91 126,91 124,86" fill="#1E293B"/>
  <!-- Motion line -->
  <path d="M118 92 Q122 94 125 94" stroke="#64748B" stroke-width="1.5" fill="none"/>
</svg>
