<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" aria-label="Autism Learning Platform - Infinity Harmony Logo">
    <defs>
        <!-- Gradients for the 4 harmonious color quadrants -->
        <linearGradient id="gradLoopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF595E" />
            <stop offset="50%" stop-color="#FFCA3A" />
            <stop offset="100%" stop-color="#52B788" />
        </linearGradient>

        <linearGradient id="gradLoopRight" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#52B788" />
            <stop offset="45%" stop-color="#1982C4" />
            <stop offset="80%" stop-color="#4D96FF" />
            <stop offset="100%" stop-color="#8338EC" />
        </linearGradient>

        <linearGradient id="gradCenterStar" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE66D" />
            <stop offset="100%" stop-color="#F77F00" />
        </linearGradient>

        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.12" />
        </filter>
    </defs>

    <!-- Circular Background Shield (Pastel Off-White / Pearl) -->
    <rect width="512" height="512" rx="128" fill="#F8FAFC" />
    <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#E2E8F0" stroke-width="4" />

    <!-- Infinity Loop Group with Drop Shadow -->
    <g filter="url(#softGlow)">
        <!-- Left Loop (Red -> Amber -> Mint) -->
        <path d="M 256,256 C 210,188 152,142 98,142 C 42,142 16,188 16,256 C 16,324 42,370 98,370 C 152,370 210,324 256,256 Z"
              fill="none"
              stroke="url(#gradLoopLeft)"
              stroke-width="52"
              stroke-linecap="round"
              stroke-linejoin="round" />

        <!-- Right Loop (Mint -> Azure -> Purple) -->
        <path d="M 256,256 C 302,324 360,370 414,370 C 470,370 496,324 496,256 C 496,188 470,142 414,142 C 360,142 302,188 256,256 Z"
              fill="none"
              stroke="url(#gradLoopRight)"
              stroke-width="52"
              stroke-linecap="round"
              stroke-linejoin="round" />
    </g>

    <!-- Center Intersecting Overlap Accent (for smooth continuous ribbon depth) -->
    <path d="M 232,220 C 242,234 251,248 256,256 C 265,270 274,284 286,298"
          fill="none"
          stroke="#4D96FF"
          stroke-width="52"
          stroke-linecap="round" />

    <!-- Discovery Sparkle / Star at Center Intersection -->
    <g transform="translate(256, 256)">
        <circle cx="0" cy="0" r="18" fill="#FFFFFF" />
        <path d="M 0,-24 Q 0,-6 18,0 Q 0,6 0,24 Q 0,6 -18,0 Q 0,-6 0,-24 Z"
              fill="url(#gradCenterStar)" />
        <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Tactile Colorful Dot Accents (Representing 4 controller buttons & milestones) -->
    <circle cx="98" cy="256" r="12" fill="#FFFFFF" stroke="#FF595E" stroke-width="4" />
    <circle cx="414" cy="256" r="12" fill="#FFFFFF" stroke="#8338EC" stroke-width="4" />
    <circle cx="180" cy="180" r="8" fill="#FFCA3A" opacity="0.85" />
    <circle cx="332" cy="332" r="8" fill="#1982C4" opacity="0.85" />
</svg>
