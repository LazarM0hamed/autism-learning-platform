<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Classification & Tri - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .classify-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
        }

        /* Progress Dots */
        .progress-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .p-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #CBD5E0;
            transition: all 0.25s ease;
        }
        .p-dot.done {
            background: #6BCB77;
            transform: scale(1.15);
        }
        .p-dot.current {
            background: #4299E1;
            box-shadow: 0 0 0 4px rgba(66, 153, 225, 0.25);
        }

        /* Central Spotlight Card (Item to Sort) */
        .spotlight-zone {
            position: relative;
            height: 175px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .item-spotlight-card {
            width: 170px;
            height: 162px;
            background: #FFFFFF;
            border: 4px solid #4299E1;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 10px 24px rgba(66, 153, 225, 0.16);
            cursor: pointer;
            user-select: none;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
            z-index: 5;
        }
        .item-spotlight-card:active {
            transform: scale(0.96);
        }
        .spotlight-visual {
            font-size: 4.4rem;
            line-height: 1;
        }
        .spotlight-color-swatch {
            width: 78px;
            height: 78px;
            border-radius: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
        }
        .spotlight-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2D3748;
        }

        /* Two Large Sorting Baskets */
        .baskets-row {
            display: flex;
            gap: 22px;
            justify-content: center;
            flex-wrap: wrap;
            width: 94%;
            max-width: 760px;
            margin-top: 4px;
        }
        .sort-basket {
            flex: 1;
            min-width: 240px;
            max-width: 350px;
            min-height: 185px;
            background: #FFFDF9;
            border: 4px solid #CBD5E0;
            border-radius: 26px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
            transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease;
            user-select: none;
        }
        .sort-basket:active {
            transform: scale(0.96);
        }
        .sort-basket.flash-success {
            border-color: #6BCB77;
            background: #F0FFF4;
            transform: scale(1.03);
        }
        .basket-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: bold;
            color: #2D3748;
            padding-bottom: 8px;
            border-bottom: 2px dashed #E2E8F0;
            width: 100%;
            justify-content: center;
        }
        .basket-collected {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            min-height: 84px;
            width: 100%;
            padding-top: 8px;
        }
        .mini-sorted-badge {
            font-size: 2.1rem;
            background: #FFFFFF;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 4px 8px;
            animation: popIn 0.25s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.4); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">🗂️ Classification & Tri</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="classify-stage">
        <!-- Category Theme Switcher -->
        <nav class="routine-pills" id="classify-pills" aria-label="Select classification theme"></nav>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.3rem, 3.3vw, 1.9rem); margin: 0;">Range chaque élément dans le bon panier !</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Round Progress Dots -->
        <div class="progress-dots" id="progress-dots"></div>

        <!-- Central Spotlight Item -->
        <div class="spotlight-zone">
            <div class="item-spotlight-card" id="spotlight-card" title="Tap to hear name"></div>
        </div>

        <!-- Two Destination Baskets -->
        <section class="baskets-row" id="baskets-row" aria-label="Sorting baskets"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/classification-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
