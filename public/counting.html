<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <title>Compter & Quantités - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .counting-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
            padding-bottom: 24px;
        }

        /* Range Switcher (1-5 vs 1-10) */
        .range-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .range-btn {
            background: #F1F5F9;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 7px 18px;
            font-size: 0.98rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .range-btn.active {
            background: #FEF08A;
            border-color: #EAB308;
            color: #713F12;
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.2);
        }

        /* Counting Tray / Basket Stage */
        .counting-board-frame {
            width: 94%;
            max-width: 580px;
            min-height: 215px;
            background: #FFFDF9;
            border: 4px solid #CBD5E1;
            border-radius: 26px;
            padding: 16px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .helper-hint {
            font-size: 0.94rem;
            font-weight: 800;
            color: #64748B;
            text-align: center;
        }

        /* 5-Column Ten-Frame Style Grid for Calm Visual Scanning */
        .objects-five-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            justify-items: center;
            align-items: center;
            width: 100%;
            max-width: 490px;
        }
        .countable-item {
            position: relative;
            width: 74px;
            height: 74px;
            background: #EFF6FF;
            border: 3px solid #BFDBFE;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.16s ease, border-color 0.2s ease, background-color 0.2s ease;
            box-sizing: border-box;
        }
        .countable-item:active {
            transform: scale(0.92);
        }
        .countable-item.counted {
            background: #ECFDF5;
            border-color: #10B981;
            transform: scale(1.05);
        }
        .count-stamp {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #10B981;
            color: #FFFFFF;
            font-size: 0.92rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
            animation: stampPop 0.2s ease;
        }
        @keyframes stampPop {
            from { transform: scale(0.4); }
            to   { transform: scale(1); }
        }

        /* Mode 2: Basket Fill Controls */
        .basket-header-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #FEFCE8;
            border: 3px solid #FACC15;
            border-radius: 20px;
            padding: 8px 24px;
            font-size: 1.35rem;
            font-weight: 800;
            color: #713F12;
        }
        .basket-controls-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }
        .add-item-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #10B981;
            color: #FFFFFF;
            border: none;
            border-radius: 22px;
            padding: 16px 32px;
            font-size: 1.35rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #047857;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            user-select: none;
        }
        .add-item-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .clear-basket-btn {
            background: #F1F5F9;
            border: 2px solid #CBD5E1;
            border-radius: 18px;
            padding: 14px 22px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease;
        }
        .clear-basket-btn:hover {
            background: #E2E8F0;
        }

        /* Number & Dice Choice Cards */
        .number-choices-grid {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 760px;
            width: 95%;
            margin-top: 4px;
        }
        .num-choice-card {
            width: 155px;
            padding: 14px 12px;
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease, opacity 0.25s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .num-choice-card:active {
            transform: scale(0.94);
        }
        .num-choice-card.soft-dim {
            opacity: 0.36;
            transform: scale(0.94);
        }
        .num-choice-card.winner {
            border-color: #10B981 !important;
            background: #ECFDF5 !important;
            transform: scale(1.06);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
        }
        .big-digit {
            font-size: 3.1rem;
            font-weight: 800;
            color: #2563EB;
            line-height: 1;
        }
        .mini-dots-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-width: 96px;
        }
        .mini-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #3B82F6;
        }

        /* Responsive Visual Sizing */
        body[data-size="normal"] .counting-board-frame { max-width: 580px; }
        body[data-size="large"] .counting-board-frame { max-width: 740px; }
        body[data-size="xlarge"] .counting-board-frame { max-width: 900px; }

        body[data-size="normal"] .countable-item { width: 74px; height: 74px; font-size: 2.8rem; }
        body[data-size="large"] .countable-item { width: 92px; height: 92px; font-size: 3.6rem; }
        body[data-size="xlarge"] .countable-item { width: 112px; height: 112px; font-size: 4.4rem; }

        body[data-size="normal"] .num-choice-card { width: 155px; }
        body[data-size="large"] .num-choice-card { width: 195px; padding: 18px 14px; }
        body[data-size="xlarge"] .num-choice-card { width: 245px; padding: 22px 18px; }

        body[data-size="normal"] .big-digit { font-size: 3.1rem; }
        body[data-size="large"] .big-digit { font-size: 4rem; }
        body[data-size="xlarge"] .big-digit { font-size: 5rem; }

        @media (max-width: 520px) {
            .countable-item { width: 54px; height: 54px; font-size: 2.1rem; }
            .num-choice-card { width: 132px; }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">🔢 Compter & Quantités</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="counting-stage">
        <!-- 3 Counting Modes -->
        <nav class="routine-pills" aria-label="Select counting mode">
            <button class="routine-pill active" id="mode-count-btn">🍎 Compter les objets</button>
            <button class="routine-pill" id="mode-basket-btn">🧺 Remplis le panier</button>
            <button class="routine-pill" id="mode-dots-btn">🎲 Points & Quantités</button>
        </nav>

        <!-- Range Switcher (1-5 vs 1-10) -->
        <div class="range-bar">
            <button class="range-btn active" data-max="5" id="range-5-btn">⭐ De 1 à 5</button>
            <button class="range-btn" data-max="10" id="range-10-btn">🌟 De 1 à 10</button>
        </div>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); margin: 0;">Combien y a-t-il de pommes ?</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Main Counting Stage -->
        <div class="counting-board-frame" id="counting-board"></div>

        <!-- Choices or Basket Dispenser Controls -->
        <section id="interaction-area" style="width: 100%; display: flex; justify-content: center;"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/counting-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
