<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Autism Platform">
    <meta name="theme-color" content="#F8FAFC">
    <title>J'entends le son (CP) - Learning Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .phonics-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
            padding-bottom: 24px;
        }

        /* Target Phoneme Sound Pill */
        .phoneme-hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: #FFFFFF;
            border: 4px solid #3B82F6;
            border-radius: 24px;
            padding: 10px 24px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.16);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .phoneme-hero-btn:active {
            transform: scale(0.96);
        }
        .phoneme-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 56px;
            height: 52px;
            padding: 0 12px;
            border-radius: 16px;
            background: #3B82F6;
            color: #FFFFFF;
            font-size: 1.75rem;
            font-weight: 800;
        }
        .phoneme-badge.dark-text {
            color: #1E293B;
        }
        .phoneme-hero-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: #1E293B;
        }

        /* Main Word / Train Stage Card */
        .phonics-board-frame {
            width: 94%;
            max-width: 660px;
            background: #FFFDF9;
            border: 4px solid #CBD5E1;
            border-radius: 26px;
            padding: 18px 16px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-sizing: border-box;
            transition: max-width 0.25s ease;
        }
        .single-word-card {
            width: 220px;
            padding: 16px;
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .single-word-card:active {
            transform: scale(0.95);
        }
        .single-word-card.solved-yes {
            border-color: #10B981;
            background: #ECFDF5;
        }
        .single-word-card.solved-no {
            border-color: #93C5FD;
            background: #EFF6FF;
        }
        .word-emoji-big {
            font-size: 4.8rem;
            line-height: 1.05;
        }
        .word-letters-display {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #1E293B;
        }
        .tap-listen-hint {
            font-size: 0.92rem;
            font-weight: 800;
            color: #64748B;
            text-align: center;
        }

        /* 2-Wagon Position Train (Début vs Fin) */
        .position-train-row {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .pos-wagon-btn {
            position: relative;
            width: 175px;
            height: 112px;
            background: #FFFFFF;
            border: 4px solid #93C5FD;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
            transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease, opacity 0.25s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .pos-wagon-btn:active {
            transform: scale(0.95);
        }
        .pos-wagon-btn::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 24px;
            right: 24px;
            height: 10px;
            background: radial-gradient(circle at 10px 5px, #1E293B 6px, transparent 7px),
                        radial-gradient(circle at calc(100% - 10px) 5px, #1E293B 6px, transparent 7px);
        }
        .pos-wagon-btn.soft-dim {
            opacity: 0.36;
            transform: scale(0.94);
        }
        .pos-wagon-btn.winner {
            border-color: #10B981;
            background: #ECFDF5;
            transform: scale(1.06);
        }

        /* Choice Buttons Row */
        .phonics-choices-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 760px;
            width: 94%;
            margin-top: 4px;
        }
        .yesno-btn {
            min-width: 195px;
            padding: 16px 26px;
            border: none;
            border-radius: 22px;
            font-size: 1.35rem;
            font-weight: 800;
            color: #FFFFFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.25s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .yesno-btn.btn-yes {
            background: #10B981;
            box-shadow: 0 6px 0 #047857;
        }
        .yesno-btn.btn-no {
            background: #F97316;
            box-shadow: 0 6px 0 #C2410C;
        }
        .yesno-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .yesno-btn.soft-dim {
            opacity: 0.36;
        }

        .word-option-card {
            width: 168px;
            padding: 14px 10px;
            background: #FFFFFF;
            border: 4px solid #E2E8F0;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease, opacity 0.25s ease;
            user-select: none;
            box-sizing: border-box;
        }
        .word-option-card:active {
            transform: scale(0.94);
        }
        .word-option-card.soft-dim {
            opacity: 0.36;
            transform: scale(0.94);
        }
        .word-option-card.winner {
            border-color: #10B981;
            background: #ECFDF5;
            transform: scale(1.06);
        }

        /* Responsive Visual Sizing */
        body[data-size="normal"] .phonics-board-frame { max-width: 660px; }
        body[data-size="large"] .phonics-board-frame { max-width: 800px; }
        body[data-size="xlarge"] .phonics-board-frame { max-width: 960px; }

        body[data-size="normal"] .single-word-card { width: 220px; }
        body[data-size="large"] .single-word-card { width: 270px; }
        body[data-size="xlarge"] .single-word-card { width: 330px; }

        body[data-size="normal"] .word-emoji-big { font-size: 4.8rem; }
        body[data-size="large"] .word-emoji-big { font-size: 6.0rem; }
        body[data-size="xlarge"] .word-emoji-big { font-size: 7.2rem; }

        body[data-size="normal"] .word-letters-display { font-size: 1.85rem; }
        body[data-size="large"] .word-letters-display { font-size: 2.35rem; }
        body[data-size="xlarge"] .word-letters-display { font-size: 2.85rem; }

        body[data-size="normal"] .yesno-btn { min-width: 195px; font-size: 1.35rem; }
        body[data-size="large"] .yesno-btn { min-width: 245px; font-size: 1.65rem; }
        body[data-size="xlarge"] .yesno-btn { min-width: 295px; font-size: 2.05rem; }

        body[data-size="normal"] .word-option-card { width: 168px; }
        body[data-size="large"] .word-option-card { width: 210px; }
        body[data-size="xlarge"] .word-option-card { width: 255px; }

        @media (max-width: 540px) {
            .word-option-card { width: 138px; }
            .pos-wagon-btn { width: 148px; height: 98px; }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-left">
            <a href="index.html" class="header-logo-link" title="Autism Learning Platform">
                <img src="assets/icons/logo.svg" alt="Infinity Harmony Logo" class="header-infinity-logo" width="42" height="42">
            </a>
            <a href="index.html" class="nav-btn" id="home-btn">⬅️ Accueil</a>
        </div>
        <h2 id="activity-title" class="category-badge">👂 J'entends le son (CP)</h2>
        <div class="header-controls">
            <div class="lang-switcher" role="radiogroup" aria-label="Select Language">
                <button class="lang-btn" data-lang="en" aria-label="English">🇬🇧 EN</button>
                <button class="lang-btn active" data-lang="fr" aria-label="Français">🇫🇷 FR</button>
            </div>
            <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
        </div>
    </header>

    <!-- In-Activity Feedback Widget -->
    <div class="alp-feedback-widget" id="alp-feedback-widget">
        <div class="feedback-card">
            <span class="feedback-prompt" id="fb-prompt-text">Tu aimes ce jeu ?</span>
            <div class="feedback-actions">
                <button class="feedback-btn like-btn" id="fb-like-btn" title="J'aime ce jeu !">
                    <span class="fb-icon">👍</span>
                    <span class="fb-count" id="fb-likes-count">0</span>
                </button>
                <button class="feedback-btn unlike-btn" id="fb-unlike-btn" title="Pas mon préféré">
                    <span class="fb-icon">👎</span>
                    <span class="fb-count" id="fb-unlikes-count">0</span>
                </button>
                <button class="feedback-btn comment-btn" id="fb-comment-btn" title="Note parent / thérapeute">
                    <span class="fb-icon">💬</span>
                    <span class="fb-text">Note</span>
                </button>
            </div>
        </div>
    </div>

    <main class="phonics-stage">
        <!-- 3 Progressive CP Phonemic Awareness Modes -->
        <nav class="routine-pills" aria-label="Select phonics mode">
            <button class="routine-pill active" id="mode-yesno-btn">✅ Oui ou Non ?</button>
            <button class="routine-pill" id="mode-findword-btn">🔍 Trouve le mot</button>
            <button class="routine-pill" id="mode-position-btn">🚂 Début ou Fin ?</button>
        </nav>

        <!-- Prompt Banner -->
        <div class="prompt-container" style="margin: 2px 0;">
            <h1 class="prompt-text" id="prompt-label" style="font-size: clamp(1.2rem, 3.2vw, 1.85rem); margin: 0;">Entends-tu le son [ O ] ?</h1>
            <button id="speak-prompt-btn" class="speak-prompt-btn" title="Repeat voice prompt" aria-label="Repeat voice prompt">🗣️</button>
        </div>

        <!-- Target Phoneme Replay Pill -->
        <button type="button" class="phoneme-hero-btn" id="phoneme-hero-btn">
            <span class="phoneme-badge" id="phoneme-badge">[ O ]</span>
            <span class="phoneme-hero-text" id="phoneme-hero-text">🔊 Réécouter le son</span>
        </button>

        <!-- Main Word / Train Stage -->
        <div class="phonics-board-frame" id="phonics-board"></div>

        <!-- Answer Choices Area -->
        <section class="phonics-choices-row" id="phonics-choices" aria-label="Phonics choices"></section>
    </main>

    <footer class="settings-bar"></footer>

    <script src="js/tracker.js"></script>
    <script src="js/phonics-ear-engine.js"></script>
    <script src="js/input-manager.js"></script>
</body>
</html>
